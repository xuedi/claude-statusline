[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
description = "Statusline renderer for Claude Code: model, git, token usage, effort, rate limits."
repository = "https://github.com/xuedi/claude-statusline"
homepage = "https://github.com/xuedi/claude-statusline"
keywords = ["claude", "claude-code", "statusline", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "claude-statusline"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = "2"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.deb]
maintainer = "Daniel Koch <xuedi@beijingcode.org>"
copyright = "2025 Daniel Koch"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = ""
extended-description = """\
Reads the Claude Code statusline JSON payload on stdin and prints a single line \
with project name, model, git branch and diff, token usage, effort level and \
5h/7d rate limits."""
assets = [
    ["target/release/claude-statusline", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/claude-statusline/README.md", "644"],
]

[package.metadata.generate-rpm]
license = "EUPL-1.2"
auto-req = "disabled"
assets = [
    { source = "target/release/claude-statusline", dest = "/usr/bin/claude-statusline", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/claude-statusline/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/claude-statusline/LICENSE", mode = "644" },
]
